name: Update member display fields

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply member display field selector
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('src/app/guild/members/MembersClient.tsx')
          text = path.read_text()

          if 'MEMBER_DISPLAY_FIELDS' in text:
              print('Display field selector already applied.')
              raise SystemExit(0)

          # Add raw defense values to the client DTO.
          text = text.replace(
              '  pdef: number | null;\n  mdef: number | null;',
              '  pdef: number | null;\n  mdef: number | null;'
          )

          # Display-field metadata.
          marker = 'const EMPTY_FORM: MemberForm = {'
          metadata = '''type DisplayFieldKey =
            | "characterName"
            | "discordUsername"
            | "job"
            | "priority"
            | "status"
            | "eligible"
            | "hp"
            | "patk"
            | "matk"
            | "rawPdef"
            | "rawMdef"
            | "pvpDamageBonus"
            | "pvpDamageReduction"
            | "pdmgPercent"
            | "mdmgPercent"
            | "pdmgReductionPercent"
            | "mdmgReductionPercent"
            | "critRes"
            | "ignorePdef"
            | "ignoreMdef"
            | "damageVsSmall"
            | "damageReductionVsSmall"
            | "damageVsMedium"
            | "damageReductionVsMedium"
            | "damageVsDemiHuman"
            | "damageReductionVsDemiHuman"
            | "damageVsBrute"
            | "damageReductionVsBrute"
            | "equipmentPdefPercent"
            | "equipmentMdefPercent";

          type DisplayField = {
            key: DisplayFieldKey;
            label: string;
            group: "Identity" | "Combat" | "Target / Equipment";
          };

          const MEMBER_DISPLAY_FIELDS: DisplayField[] = [
            { key: "characterName", label: "Character", group: "Identity" },
            { key: "discordUsername", label: "Discord", group: "Identity" },
            { key: "job", label: "Job", group: "Identity" },
            { key: "priority", label: "Priority", group: "Identity" },
            { key: "status", label: "Status", group: "Identity" },
            { key: "eligible", label: "Eligible", group: "Identity" },
            { key: "hp", label: "HP", group: "Combat" },
            { key: "patk", label: "PATK", group: "Combat" },
            { key: "matk", label: "MATK", group: "Combat" },
            { key: "rawPdef", label: "Raw PDEF", group: "Combat" },
            { key: "rawMdef", label: "Raw MDEF", group: "Combat" },
            { key: "pvpDamageBonus", label: "PvP DMG Bonus", group: "Combat" },
            { key: "pvpDamageReduction", label: "PvP DMG Reduction", group: "Combat" },
            { key: "pdmgPercent", label: "P DMG %", group: "Combat" },
            { key: "mdmgPercent", label: "M DMG %", group: "Combat" },
            { key: "pdmgReductionPercent", label: "P DMG Reduction %", group: "Combat" },
            { key: "mdmgReductionPercent", label: "M DMG Reduction %", group: "Combat" },
            { key: "critRes", label: "Crit Resistance", group: "Combat" },
            { key: "ignorePdef", label: "Ignore PDEF", group: "Combat" },
            { key: "ignoreMdef", label: "Ignore MDEF", group: "Combat" },
            { key: "damageVsSmall", label: "DMG vs Small", group: "Target / Equipment" },
            { key: "damageReductionVsSmall", label: "Reduction vs Small", group: "Target / Equipment" },
            { key: "damageVsMedium", label: "DMG vs Medium", group: "Target / Equipment" },
            { key: "damageReductionVsMedium", label: "Reduction vs Medium", group: "Target / Equipment" },
            { key: "damageVsDemiHuman", label: "DMG vs Demi-Human", group: "Target / Equipment" },
            { key: "damageReductionVsDemiHuman", label: "Reduction vs Demi-Human", group: "Target / Equipment" },
            { key: "damageVsBrute", label: "DMG vs Brute", group: "Target / Equipment" },
            { key: "damageReductionVsBrute", label: "Reduction vs Brute", group: "Target / Equipment" },
            { key: "equipmentPdefPercent", label: "Equipment PDEF %", group: "Target / Equipment" },
            { key: "equipmentMdefPercent", label: "Equipment MDEF %", group: "Target / Equipment" },
          ];

          const DEFAULT_MEMBER_DISPLAY_FIELDS: DisplayFieldKey[] = [
            "characterName",
            "discordUsername",
            "job",
            "priority",
            "status",
            "eligible",
          ];

          '''
          text = text.replace(marker, metadata + marker, 1)

          # State + persistence.
          state_marker = '  const [\n    leaveSaving,\n    setLeaveSaving,\n  ] = useState(false);'
          state_add = state_marker + '''

  const [displayFields, setDisplayFields] =
    useState<DisplayFieldKey[]>(DEFAULT_MEMBER_DISPLAY_FIELDS);

  const [showDisplayFields, setShowDisplayFields] =
    useState(false);

  useEffect(() => {
    try {
      const saved = window.localStorage.getItem("rooc.guild.members.displayFields");
      if (!saved) return;
      const parsed = JSON.parse(saved);
      if (!Array.isArray(parsed)) return;
      const allowed = new Set(MEMBER_DISPLAY_FIELDS.map((field) => field.key));
      const valid = parsed.filter((key): key is DisplayFieldKey => allowed.has(key));
      setDisplayFields(valid);
    } catch {
      // Keep defaults if the stored preference is invalid.
    }
  }, []);

  useEffect(() => {
    window.localStorage.setItem(
      "rooc.guild.members.displayFields",
      JSON.stringify(displayFields)
    );
  }, [displayFields]);

  function toggleDisplayField(field: DisplayFieldKey) {
    setDisplayFields((current) =>
      current.includes(field)
        ? current.filter((key) => key !== field)
        : [...current, field]
    );
  }

  function resetDisplayFields() {
    setDisplayFields([...DEFAULT_MEMBER_DISPLAY_FIELDS]);
  }

  function isDisplayFieldVisible(field: DisplayFieldKey) {
    return displayFields.includes(field);
  }

  function rawDefense(
    value: number | null,
    percent: number | null
  ) {
    const absolute = Number(value ?? 0);
    const multiplier = 1 + Number(percent ?? 0) / 100;
    return multiplier <= 0 ? 0 : absolute / multiplier;
  }
'''
          if state_marker not in text:
              raise SystemExit('State marker not found')
          text = text.replace(state_marker, state_add, 1)

          # Replace the member table with a dynamic-column table.
          start = text.find('        <div className="overflow-x-auto rounded-xl border border-zinc-800 bg-zinc-900">')
          end_marker = '''\n        {showImport &&'''
          end = text.find(end_marker, start)
          if start == -1 or end == -1:
              raise SystemExit('Member table boundaries not found')

          table = '''        <div className="mb-6 rounded-xl border border-zinc-800 bg-zinc-900 p-4">
          <div className="flex flex-wrap items-center justify-between gap-3">
            <div>
              <h2 className="text-sm font-semibold text-zinc-200">Display Fields</h2>
              <p className="mt-1 text-xs text-zinc-500">
                Choose which member information appears in the table. Your selection is saved on this device.
              </p>
            </div>

            <div className="flex gap-2">
              <button
                type="button"
                onClick={() => setShowDisplayFields((current) => !current)}
                className="cursor-pointer rounded-lg border border-zinc-700 px-3 py-1.5 text-xs font-medium text-zinc-300 transition hover:bg-zinc-800 hover:text-white"
              >
                {showDisplayFields ? "Hide Fields" : "Choose Fields"}
              </button>
              <button
                type="button"
                onClick={resetDisplayFields}
                className="cursor-pointer rounded-lg border border-zinc-800 px-3 py-1.5 text-xs text-zinc-500 transition hover:bg-zinc-800 hover:text-zinc-300"
              >
                Reset
              </button>
            </div>
          </div>

          {showDisplayFields && (
            <div className="mt-4 grid gap-4 md:grid-cols-3">
              {["Identity", "Combat", "Target / Equipment"].map((group) => (
                <div key={group}>
                  <h3 className="mb-2 text-xs font-semibold uppercase tracking-wide text-zinc-500">
                    {group}
                  </h3>
                  <div className="space-y-2">
                    {MEMBER_DISPLAY_FIELDS.filter((field) => field.group === group).map((field) => (
                      <label key={field.key} className="flex cursor-pointer items-center gap-2 text-sm text-zinc-300">
                        <input
                          type="checkbox"
                          checked={isDisplayFieldVisible(field.key)}
                          onChange={() => toggleDisplayField(field.key)}
                          className="cursor-pointer"
                        />
                        {field.label}
                      </label>
                    ))}
                  </div>
                </div>
              ))}
            </div>
          )}
        </div>

        <div className="overflow-x-auto rounded-xl border border-zinc-800 bg-zinc-900">
          <table className="w-full min-w-max text-sm">
            <thead className="border-b border-zinc-800 bg-zinc-900">
              <tr>
                {MEMBER_DISPLAY_FIELDS.filter((field) => displayFields.includes(field.key)).map((field) => (
                  <th key={field.key} className="whitespace-nowrap px-4 py-3 text-left font-medium text-zinc-400">
                    {field.label}
                  </th>
                ))}
                <th className="whitespace-nowrap px-4 py-3 text-right font-medium text-zinc-400">Actions</th>
              </tr>
            </thead>
            <tbody>
              {loading ? (
                <tr>
                  <td colSpan={displayFields.length + 1} className="px-4 py-10 text-center text-sm text-zinc-500">Loading members...</td>
                </tr>
              ) : filteredMembers.length === 0 ? (
                <tr>
                  <td colSpan={displayFields.length + 1} className="px-4 py-10 text-center text-sm text-zinc-500">No members found.</td>
                </tr>
              ) : (
                filteredMembers.map((member) => {
                  const values: Record<DisplayFieldKey, React.ReactNode> = {
                    characterName: (
                      <Link href={`/guild/members/${member.id}`} className="font-medium text-zinc-100 hover:text-white hover:underline">{member.characterName}</Link>
                    ),
                    discordUsername: member.discordUsername ?? "—",
                    job: member.job ?? "—",
                    priority: formatPriority(member.priority),
                    status: (
                      <span className={`rounded-full px-2 py-1 text-xs font-medium ${member.active ? "bg-emerald-950 text-emerald-300" : "bg-zinc-800 text-zinc-400"}`}>
                        {member.active ? "Active" : "Inactive"}
                      </span>
                    ),
                    eligible: (
                      <span className={`rounded-full px-2 py-1 text-xs font-medium ${member.eligible ? "bg-blue-950 text-blue-300" : "bg-zinc-800 text-zinc-400"}`}>
                        {member.eligible ? "Yes" : "No"}
                      </span>
                    ),
                    hp: member.hp ?? "—",
                    patk: member.patk ?? "—",
                    matk: member.matk ?? "—",
                    rawPdef: rawDefense(member.pdef, member.equipmentPdefPercent) || "—",
                    rawMdef: rawDefense(member.mdef, member.equipmentMdefPercent) || "—",
                    pvpDamageBonus: member.pvpDamageBonus ?? "—",
                    pvpDamageReduction: member.pvpDamageReduction ?? "—",
                    pdmgPercent: member.pdmgPercent ?? "—",
                    mdmgPercent: member.mdmgPercent ?? "—",
                    pdmgReductionPercent: member.pdmgReductionPercent ?? "—",
                    mdmgReductionPercent: member.mdmgReductionPercent ?? "—",
                    critRes: member.critRes ?? "—",
                    ignorePdef: member.ignorePdef ?? "—",
                    ignoreMdef: member.ignoreMdef ?? "—",
                    damageVsSmall: member.damageVsSmall ?? "—",
                    damageReductionVsSmall: member.damageReductionVsSmall ?? "—",
                    damageVsMedium: member.damageVsMedium ?? "—",
                    damageReductionVsMedium: member.damageReductionVsMedium ?? "—",
                    damageVsDemiHuman: member.damageVsDemiHuman ?? "—",
                    damageReductionVsDemiHuman: member.damageReductionVsDemiHuman ?? "—",
                    damageVsBrute: member.damageVsBrute ?? "—",
                    damageReductionVsBrute: member.damageReductionVsBrute ?? "—",
                    equipmentPdefPercent: member.equipmentPdefPercent ?? "—",
                    equipmentMdefPercent: member.equipmentMdefPercent ?? "—",
                  };

                  return (
                    <tr key={member.id} className="border-b border-zinc-800 last:border-0 transition hover:bg-zinc-800/50">
                      {MEMBER_DISPLAY_FIELDS.filter((field) => displayFields.includes(field.key)).map((field) => (
                        <td key={field.key} className="whitespace-nowrap px-4 py-3 text-zinc-300">
                          {values[field.key]}
                        </td>
                      ))}
                      <td className="whitespace-nowrap px-4 py-3 text-right">
                        {canEditMember(member) ? (
                          <button type="button" onClick={() => openMember(member)} className="cursor-pointer rounded-lg border border-zinc-700 px-3 py-1.5 text-xs font-medium text-zinc-300 transition hover:border-zinc-500 hover:bg-zinc-800 hover:text-white">
                            Edit
                          </button>
                        ) : (
                          <span className="text-xs text-zinc-600">View only</span>
                        )}
                      </td>
                    </tr>
                  );
                })
              )}
            </tbody>
          </table>
        </div>
'''
          text = text[:start] + table + text[end:]

          # React.ReactNode requires React namespace; use the imported type instead.
          text = text.replace('Record<DisplayFieldKey, React.ReactNode>', 'Record<DisplayFieldKey, import("react").ReactNode>')

          # Make the existing form labels use Raw PDEF/MDEF where displayed in the edit form.
          text = text.replace('["PDEF", "pdef"],\n                        ["MDEF", "mdef"],', '["Raw PDEF", "pdef"],\n                        ["Raw MDEF", "mdef"],')

          path.write_text(text)
          print('Updated', path)
          PY

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/guild/members/MembersClient.tsx
          git commit -m "feat: add selectable member display fields"
          git push origin main

      - name: Remove temporary workflow
        if: success()
        run: |
          git rm .github/workflows/rooc-members-display-fields.yml
          git commit -m "chore: remove temporary display field updater"
          git push origin main
