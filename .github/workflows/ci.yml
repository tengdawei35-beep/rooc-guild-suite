name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, fix/ro3-jobs-and-stats]

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rooc_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d rooc_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/rooc_ci?schema=public
      SESSION_SECRET: ci-only-session-secret-not-for-production
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Combat engine regression tests
        run: npm run test:combat-engine
      - name: Billing entitlement regression tests
        run: npm run test:billing
      - name: Generate Prisma Client
        run: npx prisma generate
      - name: Apply migrations
        run: npx prisma migrate deploy
      - name: TypeScript
        run: npx tsc --noEmit
      - name: RO3 scoring composition tests
        run: npm run test:ro3-scoring
      - name: RO3 simulator sensitivity report
        run: npm run report:ro3-sensitivity
      - name: ESLint
        run: npx eslint "src/app/api/apply/[token]/route.ts" "src/app/api/apply/[token]/ocr/route.ts" "src/app/api/guild/applicants/route.ts" "src/app/api/guild/members/route.ts" "src/app/api/guild/members/[memberId]/route.ts" "src/app/api/guild/members/ocr/route.ts" "src/app/apply/[token]/ApplicantApplyClient.tsx" "src/lib/ocr/ro3-stats.ts"
      - name: Production build
        run: npm run build
