name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, fix/ro3-jobs-and-stats]

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rooc_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d rooc_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/rooc_ci?schema=public
      SESSION_SECRET: ci-only-session-secret-not-for-production
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Production dependency vulnerability audit
        run: npm audit --omit=dev --audit-level=high
      - name: Security upload validation tests
        run: npm run test:security
      - name: Combat engine regression tests
        run: npm run test:combat-engine
      - name: Billing entitlement regression tests
        run: npm run test:billing
      - name: Generate Prisma Client
        run: npx prisma generate
      - name: Apply migrations
        run: npx prisma migrate deploy
      - name: TypeScript
        run: npx tsc --noEmit
      - name: RO3 scoring composition tests
        run: npm run test:ro3-scoring
      - name: RO3 simulator sensitivity report
        run: npm run report:ro3-sensitivity
      - name: ESLint changed files
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            git fetch origin "${{ github.base_ref }}" --depth=1
            diff_range="origin/${{ github.base_ref }}...HEAD"
          else
            diff_range="${GITHUB_EVENT_BEFORE}..${GITHUB_SHA}"
          fi

          mapfile -t changed_files < <(
            git diff --name-only --diff-filter=ACMR "$diff_range" |
            grep -E '[.]((js)|(jsx)|(ts)|(tsx))$' || true
          )

          if (( ${#changed_files[@]} > 0 )); then
            npx eslint "${changed_files[@]}"
          else
            echo "No changed JavaScript or TypeScript files to lint."
          fi
      - name: Production build
        run: npm run build
