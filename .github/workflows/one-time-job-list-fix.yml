name: One-time job list fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.event.head_commit.message != 'chore: apply canonical job lists'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update job lists
        run: |
          python - <<'PY'
          from pathlib import Path

          members = Path("src/app/guild/members/MembersClient.tsx")
          text = members.read_text(encoding="utf-8")
          old = '''const AVAILABLE_JOBS = [
            "Lord Knight",
            "High Priest",
            "High Wizard",
            "Whitesmith",
            "Sniper",
            "Assassin Cross",
            "Paladin",
            "Champion",
            "Professor",
            "Stalker",
            "Creator",
            "Clown",
            "Gypsy",
            "Gunslinger",
          ] as const;'''
          new = '''const AVAILABLE_JOBS = [
            "Lord Knight",
            "Paladin",
            "High Priest",
            "Champion",
            "Sniper",
            "Bard",
            "Gypsy",
            "High Wizard",
            "Professor",
            "Assassin Cross",
            "Stalker",
            "Mastersmith",
            "Biochemist (Plant)",
            "Doram (Physical)",
            "Gunslinger",
            "Super Novice",
            "Doram (Magic)",
            "Biochemist (Physical)",
            "Shiranui",
            "Doram (Support)",
          ] as const;'''
          if old not in text:
              raise SystemExit("MembersClient job list was not found")
          members.write_text(text.replace(old, new), encoding="utf-8")

          rankings = Path("src/app/guild/rankings/RankingsClient.tsx")
          text = rankings.read_text(encoding="utf-8")
          old = '''const DPS_JOBS = new Set([
            "Lord Knight",
            "High Wizard",
            "Sniper",
            "Assassin Cross",
            "Stalker",
            "Champion",
            "Whitesmith",
            "Creator",
            "Gunslinger",
          ]);'''
          new = '''const DPS_JOBS = new Set([
            "Lord Knight",
            "Paladin",
            "High Wizard",
            "Sniper",
            "Assassin Cross",
            "Stalker",
            "Champion",
            "Mastersmith",
            "Biochemist (Physical)",
            "Doram (Physical)",
            "Gunslinger",
            "Super Novice",
            "Doram (Magic)",
            "Shiranui",
          ]);'''
          if old not in text:
              raise SystemExit("RankingsClient DPS job list was not found")
          rankings.write_text(text.replace(old, new), encoding="utf-8")
          PY

      - name: Commit changes and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/guild/members/MembersClient.tsx src/app/guild/rankings/RankingsClient.tsx .github/workflows/one-time-job-list-fix.yml
          git rm .github/workflows/one-time-job-list-fix.yml
          git commit -m "chore: apply canonical job lists"
          git push origin main