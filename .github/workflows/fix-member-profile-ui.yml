name: Apply member profile UI fixes

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch member profile
        run: |
          python - <<'PY'
          from pathlib import Path

          page = Path('src/app/guild/members/[memberId]/page.tsx')
          text = page.read_text()
          start = text.index('      <div className="border-b border-zinc-800 bg-zinc-950 px-6 py-4 text-white">')
          end = text.index('      <MemberProfileClient memberId={memberId} />', start)
          text = text[:start] + text[end:]
          text = text.replace('<MemberProfileClient memberId={memberId} />', '<MemberProfileClient memberId={memberId} rawPdef={rawPdef} />', 1)
          page.write_text(text)

          client = Path('src/app/guild/members/[memberId]/MemberProfileClient.tsx')
          text = client.read_text()
          text = text.replace(
              '''export default function MemberProfileClient({\n  memberId,\n}: {\n  memberId: string;\n}) {''',
              '''export default function MemberProfileClient({\n  memberId,\n  rawPdef,\n}: {\n  memberId: string;\n  rawPdef: number;\n}) {''',
              1,
          )
          marker = '''        {/* ====================================================== */}\n        {/* CORE STATS */}\n        {/* ====================================================== */}\n'''
          derived = '''        {/* ====================================================== */}\n        {/* DERIVED CHARACTER STATS */}\n        {/* ====================================================== */}\n\n        <StatSection\n          title="Derived Character Stats"\n          stats={[\n            [\n              "RAW PDEF",\n              rawPdef,\n            ],\n          ]}\n        />\n\n'''
          text = text.replace(marker, derived + marker, 1)
          old = '''                {formatValue(\n                  value,\n                  percentage\n                )}'''
          new = '''                {formatValue(\n                  value,\n                  percentage &&\n                    ![\n                      "Ignore P.DEF",\n                      "Ignore M.DEF",\n                      "PvP Damage Bonus",\n                      "PvP Damage Reduction",\n                    ].includes(label)\n                )}'''
          text = text.replace(old, new, 1)
          client.write_text(text)
          PY

      - name: Verify
        run: |
          grep -q 'rawPdef={rawPdef}' 'src/app/guild/members/[memberId]/page.tsx'
          grep -q 'Derived Character Stats' 'src/app/guild/members/[memberId]/MemberProfileClient.tsx'

      - name: Commit and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'src/app/guild/members/[memberId]/page.tsx' 'src/app/guild/members/[memberId]/MemberProfileClient.tsx'
          git commit -m 'fix: improve member profile stat presentation'
          git rm .github/workflows/fix-member-profile-ui.yml
          git commit -m 'chore: remove temporary UI fix workflow'
          git push
