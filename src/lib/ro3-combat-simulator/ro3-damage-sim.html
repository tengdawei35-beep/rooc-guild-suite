// What a pet slot does for your damage, as the engine applies it (petEffects), and the pet's own texts for the tooltip.
const fillTpl = (tpl, d, alt = []) => esc(tpl.replace(/\$\{(\d+)\}/g, (_, i) => d?.[i - 1] ?? '?').replace(/@\{(\d+)\}/g, (_, i) => alt[i - 1] ?? '?'));
const uptime = (t) => Math.min(1, t.durMs / t.periodMs);
const buffLine = (t) => `${esc(t.name)}: ${t.attrs.map(([id, v]) => esc(attrText(id, v))).join(', ')} for ${secs(t.durMs)} every ${secs(t.periodMs)} <span class="mut">(${pct(uptime(t), 0)} of the time)</span>`;
function petHitLines(fx, slot) {
  const grouped = new Map();
  for (const h of fx.hits.filter((h) => h.slot === slot)) {
    const g = grouped.get(h.name) ?? { ...h, count: 0, totalPct: 0 };
    g.count++; g.totalPct += h.pct ?? 0;
    grouped.set(h.name, g);
  }
  return [...[...grouped.values()].map((h) => h.sharePct
    ? `${esc(h.name)}: ${fmt(h.sharePct * 100)}% of the Primary skill's actual total damage every ${secs(h.periodMs)}`
    : `${esc(h.name)}: ${h.count} hit${h.count === 1 ? '' : 's'}, ${+h.totalPct.toFixed(1)}% owner Adaptive ATK total every ${secs(h.periodMs)}`),
    ...fx.ownerHits.filter((h) => h.slot === slot).map((h) => `${esc(h.name)}: ${h.pct}% owner Adaptive ATK on landed owner attacks for ${secs(h.durMs)}; ${secs(h.icdMs)} internal cooldown`),
    ...fx.modifiers.filter((m) => m.slot === slot).map((m) => m.extraMs
      ? `${esc(m.name)}: modeled Primary buffs last ${secs(m.extraMs)} longer`
      : `${esc(m.name)}: Primary damage +${m.pct}%`)];
}
// The stats a slot gives, the damage ones first. P.ATK = M.ATK and P.DEF = M.DEF for every pet, so equal pairs read as one ("ATK", "DEF").
const PSTAT_ORDER = [103, 104, 101, 102, 105, 106];
const PSTAT_SHORT = { 101: 'HP', 102: 'SP' };
const statLine = (pairs, full = false) => {
  const m = new Map(pairs);
  const out = [];
  for (const a of PSTAT_ORDER) {
    if (!m.has(a)) continue;
    const twin = a === 103 ? 104 : a === 105 ? 106 : 0;
    if (!full && twin && m.get(twin) === m.get(a)) out.push(`<span${a === 103 ? ' class="k"' : ''}>${a === 103 ? 'ATK' : 'DEF'} ${fmt(m.get(a))}</span>`);
    else if (!full && (a === 104 || a === 106) && m.get(a - 1) === m.get(a)) continue;
    else out.push(`<span${a === 103 || a === 104 ? ' class="k"' : ''}>${full ? ATTR_NAME[a] : PSTAT_SHORT[a] ?? ATTR_NAME[a]} ${fmt(m.get(a))}</span>`);
  }
  return out.join(' · ');
};
const pa = { rank: '1.0', lv: 99 }; // the "All pets" bar

    }

    if (locked) { el.innerHTML = `<span class="mut">This slot opens at base Lv ${PR.fightLv[i]}: the pet is left out until then.</span>`; el.dataset.tip = ''; return; }
    const st = pet.star[slot.star - 1];
    const timed = fx.timedBuffs.filter((t) => t.slot === i);

    }
    const heading = i === 0 ? `<b>${esc(pet.main.name)}</b> every ${secs(st.primary.cd)}`

    el.innerHTML = heading + (lines.length ? `<br>${lines.map((l) => `<span class="ok">✓</span> ${l}`).join('<br>')}` : `<br><span class="mut">${note}</span>`)
      + notes.map((n) => `<br><span class="mut">Model note: ${esc(n)}</span>`).join('');
    el.dataset.tip = `<b>${esc(pet.name)}</b> <span class="mut">${slot.star} ★</span><br><b>${esc(pet.main.name)}</b> <span class="mut">Primary Battle Skill · cooldown ${secs(st.primary.cd)}</span><br>${fillTpl(pet.main.tpl, st.m, st.ma)}<br><br><b>${esc(pet.pas.name)}</b> <span class="mut">Passive (Utility slot)</span><br>${fillTpl(pet.pas.tpl, st.p, st.pa)}${pet.core ? `<br><br><b>${esc(pet.core.name)}</b> <span class="mut">Core passive (the lowest Utility slot that has one)</span><br>${fillTpl(pet.core.tpl, st.c, st.ca)}` : ''}`;
  });
  S.assist.forEach((a, i) => {
    const row = $(`#sup${i}`);

    row.classList.toggle('locked', locked);

  });
  const supports = activeAssist();
  const [dep, sup, all] = [petStats(lineup, [], S.level, data), petStats([], supports, S.level, data), petStats(lineup, supports, S.level, data)];
  $('#petStatSum').innerHTML = !all.length ? '<span class="hint">No pet stats yet: pick a pet, a rank and a level (level 0 leaves a pet out).</span>'
    : `<span class="pill auto" data-tip="${esc(`<b>Deployed</b> ${statLine(dep, true) || '–'}<br><b>Support</b> ${statLine(sup, true) || '–'}<br><span class="mut">Added to Character Info like gear: flat stats the percent bonuses multiply.</span>`)}">Pets give you ${statLine(all)}</span>`;
  const damageLines = lineup.flatMap((_, i) => petHitLines(fx, i));
  $('#petSummary').innerHTML = fx.timedBuffs.length + damageLines.length
    ? [...fx.timedBuffs.map((t) => `<span class="pill auto" data-tip="${esc(`<b>${esc(t.name)}</b><br>${buffLine(t)}`)}">${t.attrs.map(([id, v]) => esc(attrText(id, v))).join(', ')} <b>${pct(uptime(t), 0)}</b></span>`),
      ...damageLines.map((text) => `<span class="pill auto">${text}</span>`)].join('')
    : '<span class="hint">No pet effect on your damage yet.</span>';
  const prof = profById(S.job, S.prof);
  const opts = [['', 'Load suggested pets…'], ...[['Basic', 0], ['Advanced', 1]].filter(([, k]) => prof?.pets[k]?.length).map(([name, k]) => [String(k), `${name}: ${prof.pets[k].map((id) => petById(id)?.name).join(', ')}`])];
  $('#petPreset').innerHTML = opts.map(([v, t]) => `<option value="${v}">${esc(t)}</option>`).join('');
}

/* ---------- cards ---------- */
// The stats a card shows in the sockets and the book: the ones that reach damage (the simulated attributes and the bonuses against a
// target's element, race and size) come first. 221 / 222 (Bonus ATK / MATK) are added to the attack by the engine.
const relevant = (a) => FX_ATTRS.has(a) || a === 221 || a === 222 || (a >= 321 && a <= 330) || (a >= 401 && a <= 410) || a === 501 || a === 503 || a === 505;
// The one damage stat on cards the data names but gives no formula for (Hunting Mastery = PVE damage): shown, never simulated.
const NOT_SIM = new Set([231]);
const isSimulated = (r) => r._kSpecialEffect.some((o) => o[0] === 8 || (o[0] === 2 && CARD_BUFFS[Math.floor(o[1] / 100)]));
// Attribute pairs as text lines ({ text, sim }), damage stats first. Three equal size bonuses (Drake) read as one line.
function attrLines(pairs) {
  const m = new Map();
  for (const [a, v] of pairs) m.set(a, (m.get(a) ?? 0) + v);
  const out = [];
  const sizes = [501, 503, 505];
  if (sizes.every((a) => m.has(a)) && new Set(sizes.map((a) => m.get(a))).size === 1) {
    out.push({ text: `DMG vs Small / Medium / Large Enemies +${+(m.get(501) / 100).toFixed(2)}%`, rel: true, sim: true });
    for (const a of sizes) m.delete(a);
  }
  for (const [a, v] of m) out.push({ text: attrText(a, v), rel: relevant(a) || NOT_SIM.has(a), sim: !NOT_SIM.has(a) });
  return out.sort((x, y) => Number(y.rel) - Number(x.rel));
}
const lineHtml = (l) => (l.sim ? esc(l.text) : `<span class="mut">${esc(l.text)} (not simulated)</span>`);
// The card's special effects in English, `sim`: the simulation applies it.
const effectsOf = (p) => p.effects.map((e) => D.tables.SpecialEffectConfig[e]).filter((r) => r?.tx).map((r) => ({
  text: r.tx, sim: isSimulated(r),
  note: r._kSpecialEffect.some((o) => o[0] === 2 && Math.floor(o[1] / 100) === 20501)
    ? 'All offensive size bonuses apply against any size; Drake adds its own bonus once.'
    : r._kSpecialEffect.some((o) => o[0] === 2 && Math.floor(o[1] / 100) === 20500) ? 'All offensive size bonuses apply against any size; only the extra damage bonus is chance-based.' : '',
}));
const fxLine = (f) => (f.sim ? `<span class="ok">✓</span> ${esc(f.text)}${f.note ? `<br><span class="mut">${esc(f.note)}</span>` : ''}` : `<span class="mut">${esc(f.text)} (not simulated)</span>`);
// What the engine models of the effects, as short lines: the size bonus (Drake) and the HIT -> Physical DMG conversion (Phreeoni).
const modeledLines = (p) => [
  ...attrLines(p.modeled.attrs),
  ...p.modeled.stunts.map(({ _kSpecialEffect: [[, src, step, , per, cap]] }) => ({ text: `${ATTR_NAME[src] ?? D.ui.attrNames[src]} → Physical DMG +${+(per / 100).toFixed(2)}% per ${step}, up to ${+(cap / 100).toFixed(2)}%`, sim: true })),
  ...(p.modeled.sizeBonusBp ? [{ text: `DMG vs Small / Medium / Large +${p.modeled.sizeBonusBp / 100}%`, sim: true }] : []),
  ...(p.modeled.ignoreSize ? [{ text: 'All size bonuses apply against any size', sim: true }] : []),
  ...(p.modeled.sizeProc ? [{ text: `${p.modeled.sizeProc.chanceBp / 100}% chance per landed hit: DMG vs Small / Medium / Large +${p.modeled.sizeProc.bonusBp / 100}%`, sim: true }] : []),
];
// A card as the wiki lists it (basic attributes of the star, skill attributes, Collection attributes) and what the wiki leaves out: the
// level bonus (CardUpgradeConfig, which the game's server adds to the stats). Groups of { title, lines (html), off, note }.
function cardGroups(id, star, lv, flash) {
  const p = cardParts({ id, star, level: lv, flash }, data);
  const groups = [
    { title: `Basic attributes · ${p.star} ★`, lines: attrLines(p.base).map(lineHtml) },
    { title: 'Skill attributes', lines: effectsOf(p).map(fxLine) },
    { title: `Level bonus · Lv ${p.level}`, lines: attrLines(p.levelAttrs).map(lineHtml), note: 'From the card level; the wiki does not list it.' },
  ];
  if (p.collectionAttrs.length) groups.push({ title: 'Collection attributes', lines: attrLines(p.collectionAttrs).map(lineHtml), off: !flash, note: flash ? 'This is a Collection card.' : 'Only on a Collection card (✦): tick Collection to count them.' });
  return { p, groups };
}
function cardTip(id, star, lv, flash) {
  const it = cardItem(id);
  const { groups } = cardGroups(id, star, lv, flash);
  return `<b>${esc(it.name)}</b> <span class="mut">${QUALITY[it._iQuality]} · ${SLOT[it._iCardPart]}${it._iIfSameCard ? ' · unique' : ''} · ${star} ★ · Lv ${lv}${flash ? ' · ✦ Collection' : ''}</span>`
    + groups.filter((g) => g.lines.length).map((g) => `<br><span class="mut">${g.title}${g.off ? ' (off)' : ''}</span>${g.lines.map((l) => `<br>${g.off ? `<span class="mut">${l}</span>` : l}`).join('')}`).join('');
}
// The two lines under a socket: what the card is (basic attributes, the effect the engine models, else its first effect), then what its level
// and Collection version add.
function cardBrief(id, star, lv, flash) {
  const p = cardParts({ id, star, level: lv, flash }, data);
  const txt = (l) => (l.sim ? l.text : `${l.text} (not simulated)`);
  const first = effectsOf(p).find((f) => !f.sim);
  const identity = [...attrLines(p.base), ...modeledLines(p)].map(txt).concat(first && !p.modeled.attrs.length && !p.modeled.stunts.length ? [first.text] : []);
  const extra = [`Lv ${p.level}: ${attrLines(p.levelAttrs).map(txt).join(', ') || '—'}`, ...(flash && p.collectionAttrs.length ? [`✦ ${attrLines(p.collectionAttrs).map(txt).join(', ')}`] : [])];
  return { identity: identity.join(' · ') || 'Level bonus only', extra: extra.join(' · '), simulated: !!(p.modeled.attrs.length || p.modeled.stunts.length || p.modeled.sizeBonusBp || p.modeled.sizeProc || p.modeled.ignoreSize) };
}
const cardMark = (id) => `<span>${esc(cardName(id)[0])}</span>${art(ICON.card(id), cardItem(id).name)}`;

const fullTotals = () => {
  const m = new Map();
  for (const t of TD.trees) for (const n of t.chain.filter((x) => x.g)) for (const [a, v] of TD.groups[n.g].per) m.set(a, (m.get(a) ?? 0) + v * n.max);
  return m;
};
const fullCost = () => TD.trees.flatMap((t) => t.chain).filter((n) => n.g).reduce((c, n) => [c[0] + TD.groups[n.g].cost[0] * n.max, c[1] + TD.groups[n.g].cost[1] * n.max], [0, 0]);
// Tries every talent of every branch point reached (the first is kept on a tie) and keeps what deals the most damage with the rotation and Target on screen.
async function bestTalents() {
  const reached = talentWalk(currentBuild(), data).reached;
  if (!reached.length) { talNote = { text: 'No branch point reached yet: set a Talent Lv of 40 or more.', key: talentKey() }; renderTalents(); return; }
  busy(true, 'Trying the job talents…', `${reached.length} branch point${reached.length > 1 ? 's' : ''} · sustained DPS of the rotation on screen`);
  await tick();
  let gain = 0;
  try {
    const before = quickDps(S);
    for (const bid of reached) {
      let best = { dps: quickDps(S), pick: talentPick(currentBuild().talents, bid, S.job, data) };
      for (const o of talentOptions(bid, S.job, talProf(), data)) {
        for (const k of o.kids) {
          const dps = quickDps({ ...S, talents: { ...S.talents, picks: { ...S.talents.picks, [bid]: [o.id, k.id] } } });
          if (dps > best.dps * 1.00001) best = { dps, pick: [o.id, k.id] };
        }
      }
      S.talents.picks[bid] = best.pick;
    }
    gain = before ? quickDps(S) / before - 1 : 0;
  } finally {
    busy(false);
  }
  talNote = { text: gain > 0.00001 ? `Best job talents: +${(gain * 100).toFixed(2)}% DPS` : 'Your job talents already deal the most the simulation can measure.', key: talentKey() };
  refresh();
}

    const b = D.tables.BuffConfig[RIDING_PASSIVES[info.g] * 100 + (lv || 1)];
    t.push(`<b>Simulated while the wolf is ridden:</b> ${(b?._kChangeAttri ?? []).map(([id, v]) => esc(attrText(id, v))).join(', ')} and +${+((b?._kSkillAttributeList?.[0]?.[4] ?? 0) / 100).toFixed(1)}% damage on Warg Charge, Warg Bite and Warg Hunt.`);
  }
  if (info.kind === 'passive0' || info.kind === 'utility') {
    if (!info.fx) t.push('<span class="mut">No damage or stat data the engine can use, so it is not simulated.</span>');

  return `<b>${esc(info.name)}</b> <span class="mut">Lv ${lv}/${info.max} · ${kind}</span><br>${t.join('<br>')}`;

function skillTile(g) {

    : info.auto && lv ? '<span class="rot auto" data-act="auto-on" data-tip="Auto-cast: assumed up for the whole fight, so it takes no rotation slot.">∞</span>' : '';

function editTotem(el) {
  const i = +el.dataset.ti, j = +el.dataset.tj, key = el.dataset.tk;
  if (key === 'id') {
    const T = TOTEMS[el.value];
    if (!el.value) S.totems.splice(i, 1);
    else if (T) S.totems[Math.min(i, S.totems.length)] = { id: +el.value, attrs: T.attrs.map(([a, , max]) => [a, max]), skills: [...T.born] };
  } else if (key === 'v') {
    if (el.value === '' || !el.checkValidity()) return;
    const p = S.totems[i].attrs[j];
    p[1] = Math.round(+el.value * echoScale(p[0]));
  } else if (key === 'skill') {
    const t = S.totems[i], id = +el.value;
    if (!id) t.skills.splice(j, 1);
    else if (!t.skills.includes(id)) t.skills[j] = id;
  }
  refresh();
}

      a.value = p.a;
      a.disabled = !e.id || !S.echoUseEntries;
      value.disabled = a.disabled || !p.a;
      value.min = -99999999 / echoScale(p.a);
      value.max = 99999999 / echoScale(p.a);

  });

}

function editEcho(el) {
  const e = S.echoes[+el.dataset.ei], key = el.dataset.ek, j = +el.dataset.ej;
  if (!e) throw new Error('Unknown Soul Echo slot.');
  el.setCustomValidity('');
  if (el.type === 'number' && (el.value === '' || !Number.isFinite(+el.value) || !el.checkValidity())) return;
  if (key === 'id') { e.id = +el.value; e.lv = Math.min(e.lv, ECHO_ITEMS[e.id]?.maxLv ?? 20); }
  else if (key === 'lv') e.lv = +el.value;
  else if (key === 'color') e.colors[j] = el.value;
  else if (key === 'a') {
    const p = e.stats[j], a = +el.value, v = Math.round(p.v / echoScale(p.a) * echoScale(a));
    if (a !== 0 && (!Number.isInteger(a) || !Object.hasOwn(D.tables.AttributeConfig, a))) { el.setCustomValidity('Choose a known attribute.'); el.reportValidity(); return; }
    if (Math.abs(v) > 99999999) { el.value = p.a; el.setCustomValidity('Reduce this bonus before changing its units.'); el.reportValidity(); return; }
    Object.assign(p, { a, v });
  } else if (key === 'v') e.stats[j].v = Math.round(+el.value * echoScale(e.stats[j].a));
  refresh();
}

function setLevel(g, to) {
  const info = groups.get(g);
  const cur = S.skills[g] | 0;
  const next = to === 'max' ? info.max : clamp(typeof to === 'number' && to !== 0 ? cur + to : 0, 0, info.max);
  S.skills[g] = next;
  if (info.usable) {
    if (!cur && next) enlist(S, g);
    if (!next) S.rotation = S.rotation.filter((x) => x !== g);
  }
  refresh();
}
function stepStat(b) {

const busy = (on, title = '', sub = '') => {

async function autoAssign() {
  const rot = rotationIds();
  busy(true, 'Optimizing stat allocation…', `${budgetOf()} points · ${rot.length ? `${rot.length} rotation skills` : 'basic attacks'} · engine optimizeStatAllocation`);
  await new Promise((r) => setTimeout(r, 60));
  try {
    const normal = data.row('JobConfig', S.job)?._kSkillNormalID?.[0] ?? 1100001;
    const res = optimizeStatAllocation(simBuild(), defender(), { mode: 'sustained', rotation: rot.length ? rot : [normal], windowMs: Math.min(20000, S.sim.seconds * 1000) }, data);
    S.stats = res.optimalStats.raw.slice();
  } finally {
    busy(false);
  }
  refresh();
}
const tick = () => new Promise((r) => setTimeout(r, 60)); // lets the busy overlay paint before the engine blocks the page
async function splitStats(pair) {
  busy(true, `Splitting ${budgetOf()} points between ${pairName(pair).replace('/', ' and ')}…`, 'engine optimizeStatSplit · sustained DPS of the current rotation');
  await tick();
  try {
    S.stats = bestSplit(S, pair).stats;
  } finally {
    busy(false);
  }
  refresh();
}
// One tab per split of the build on screen, so their DPS sit side by side.
async function compareSplits() {
  const pairs = splitPairs();
  if (book.builds.length + pairs.length > MAX_BUILDS) return;
  busy(true, `Comparing ${pairs.map(pairName).join(', ')}…`, 'one tab per split');
  await tick();
  let first = 0;
  try {
    const src = buildById(book.active);
    book.baseline ??= src.id;
    for (const pair of pairs) {
      const state = JSON.parse(JSON.stringify(src.state));
      state.stats = bestSplit(state, pair).stats;
      const id = book.next++;
      book.builds.push({ id, name: uniqueName(`${src.name.replace(/ · [A-Z/]+$/, '')} · ${pairName(pair)}`), state });
      first ||= id;
    }
  } finally {
    busy(false);
  }
  switchBuild(first);
}
// The two stats the game recommends for a profession (JobProfessConfig: [[stat, weight]]) as 0-based stat indexes. A profession that names
// one stat only has no pair: the best of the class's usual splits is used.
const pairOf = (prof) => {
  const s = [...new Set((prof?.stat ?? []).map(([i]) => i - 1))];
  return s.length === 2 ? s : null;
};
// A new tab from a profession template: the template's skills, rotation, wolf and pets (and with a `tier`, the game's recommended cards) on
// the stat split the game recommends for the profession (else the best of the class's usual splits). Gear and settings carry over from the
// open build when it is the same class; another class starts without typed finals.
async function newFromTemplate(profId, tier = -1) {
  const job = Number(Object.keys(D.ui.profs).find((j) => D.ui.profs[j].some((p) => p.id === profId)));
  if (!job || book.builds.length >= MAX_BUILDS) return;
  const prof = profById(job, profId);
  busy(true, `Building ${prof.name}…`, 'skills, rotation, pets, cards and the stat split');
  await tick();
  let id = 0;
  try {
    const src = buildById(book.active);
    const same = src.state.job === job;
    const state = JSON.parse(JSON.stringify(src.state));
    state.hold = {}; // a template is a what-if: nothing in it was typed from your panel
    if (!same) Object.assign(state, { ex: {}, bonus: defaultState().bonus, element: 1, bonusPoints: STAT_BONUS, assist: emptyAssist(), cards: emptyCards(), gear: emptyGear() });
    applyTemplate(state, job, profId, tier);
    const pair = pairOf(prof);
    const best = (pair ? [pair] : splitPairs(state)).map((p) => bestSplit(state, p)).sort((a, b) => b.dps - a.dps)[0];
    if (best) state.stats = best.stats;
    id = book.next++;
    book.builds.push({ id, name: uniqueName(tier < 0 ? prof.name : `${prof.name} · ${tier ? 'Adv' : 'Basic'}`), state });
    book.baseline ??= src.id;
  } finally {
    busy(false);
  }
  switchBuild(id);
}

/* ---------- simulation ---------- */
const PALETTE = ['#e8892f', '#4a86c5', '#3f9a4a', '#b3382a', '#8a5ab8', '#d4b02a', '#2a9aa8', '#c4608a', '#7a6a4a', '#5a6a8a'];
let timer = 0;
function schedule() {
  clearTimeout(timer);
  timer = setTimeout(simulateNow, 90);
}
// The latest analysis of every tab, with the exact state it was made from: switching tabs and comparing never re-simulates a
// tab whose state did not change.
const results = new Map();
const stateKey = (st) => JSON.stringify(st);
function runSim(st) {
  const seconds = clamp(st.sim.seconds, 1, 300);
  const res = simulateDistribution(simBuild(st), defender(st), rotationIds(st), seconds * 1000,
    { runs: clamp(st.sim.runs, 100, 10000), seed: st.sim.seed, bins: 72, bucketMs: Math.max(1000, Math.ceil(seconds / 60) * 1000) }, data);
  return analyze(res, st);
}
function simulateNow() {
  try {
    $('.err')?.remove();
    const key = stateKey(S);
    const hit = results.get(book.active);
    if (hit?.a && hit.key === key) {
      last = hit.a;
    } else {
      const t0 = performance.now();
      last = runSim(S);
      last.ms = performance.now() - t0;
      results.set(book.active, { key, a: last });
    }
    renderReport();
  } catch (e) {
    showError(e);
  }
  simulateOthers();
}
// The other tabs are simulated one at a time in the background (only those whose state changed since their last result), so
// their DPS is always on the tabs and in the comparison.
let othersTimer = 0;
function simulateOthers() {
  clearTimeout(othersTimer);
  const b = book.builds.find((x) => x.id !== book.active && results.get(x.id)?.key !== stateKey(x.state));
  if (!b) return;
  othersTimer = setTimeout(() => {
    const key = stateKey(b.state);
    try {
      const t0 = performance.now();
      const a = runSim(b.state);
      a.ms = performance.now() - t0;
      results.set(b.id, { key, a });
    } catch (e) {
      console.warn(e);
      results.set(b.id, { key, a: null });
    }
    // The open tab's numbers and charts are compared with the baseline tab, so redraw them when that one's result arrives.
    if (b.id === book.baseline) renderReport();
    else {
      updateBadges();
      renderCompare();
    }
    simulateOthers();
  }, 40);
}

function analyze(res, st = S) {
  const n = res.runs;
  const nb = res.nBuckets;
  const W = nb + 1;
  const sorted = Float64Array.from(res.totals).sort();
  let sum = 0;
  for (const v of sorted) sum += v;
  const mean = sum / n;
  let ss = 0;
  for (const v of sorted) ss += (v - mean) ** 2;
  const q = (p) => {
    const x = p * (n - 1);
    const i = Math.floor(x);
    return sorted[i] + (sorted[Math.min(n - 1, i + 1)] - sorted[i]) * (x - i);
  };
  const cum = { mean: new Float64Array(W), lo: new Float64Array(W), hi: new Float64Array(W) };
  const col = new Float64Array(n);
  for (let b = 1; b < W; b++) {
    let s = 0;
    for (let r = 0; r < n; r++) { col[r] = res.cumulative[r * W + b]; s += col[r]; }
    col.sort();
    cum.mean[b] = s / n;
    cum.lo[b] = col[Math.floor(0.05 * (n - 1))];
    cum.hi[b] = col[Math.ceil(0.95 * (n - 1))];
  }
  const total = res.skills.reduce((a, s) => a + s.total, 0);
  const skills = res.skills.map((s) => {
    const landed = s.hits + s.crits;
    const attempts = landed + s.misses;
    return { ...s, attempts, landed, hitPct: attempts ? landed / attempts : 1, critPct: landed ? s.crits / landed : 0, share: total ? s.total / total : 0 };
  }).sort((a, b) => b.total - a.total).map((s, i) => ({ ...s, color: PALETTE[i % PALETTE.length] }));
  return {
    n, nb, mean, sd: Math.sqrt(ss / n), p5: q(0.05), p50: q(0.5), p95: q(0.95), min: sorted[0], max: sorted[n - 1], sorted, cum, skills,
    bucketS: res.bucketMs / 1000, seconds: res.durationMs / 1000, expected: res.expectedTotal, det: res.deterministic, seed: st.sim.seed, target: { ...st.target },
  };
}

/* ---------- report ---------- */
const delta = (cur, ref) => (ref ? cur / ref - 1 : null);
const dtxt = (d) => (d === null ? '' : `<span class="d ${d >= 0 ? 'up' : 'down'}">${d >= 0 ? '▲' : '▼'} ${Math.abs(d * 100).toFixed(1)}%</span>`);
const spanText = (s) => (s < 120 ? `${s.toFixed(1)} s` : s < 7200 ? `${(s / 60).toFixed(1)} min` : s < 172800 ? `${(s / 3600).toFixed(1)} h` : `${(s / 86400).toFixed(1)} days`);
// What the report is compared with: a pinned snapshot, else the baseline tab (another build, simulated for the same fight length).
function reference() {
  if (pinned) return pinned;
  const r = book.baseline !== null && book.baseline !== book.active ? results.get(book.baseline)?.a : null;
  return r && last && r.seconds === last.seconds ? r : null;
}
const referenceName = () => (pinned ? 'pinned baseline' : `baseline: ${esc(buildById(book.baseline)?.name ?? '')}`);

function renderReport() {
  const a = last;
  const p = reference();
  if (!a) return;
  const dps = a.mean / a.seconds;
  const pdps = p ? p.mean / p.seconds : 0;
  const chip = (l, v, d) => `<div class="chip"><small>${l}</small><b>${v}</b><i>${d || '&nbsp;'}</i></div>`;
  $('#live').innerHTML = chip('Mean DPS', fmt(dps), dtxt(delta(dps, pdps))) + chip(`Damage in ${a.seconds}s`, fmt(a.mean), dtxt(delta(a.mean, p?.mean))) + chip('p5 – p95', `${fmtK(a.p5)} – ${fmtK(a.p95)}`, '');
  $('#meta').textContent = `${a.n.toLocaleString()} fights · ${a.ms.toFixed(0)} ms`;
  const landed = a.skills.reduce((s, k) => s + k.landed, 0);
  const crits = a.skills.reduce((s, k) => s + k.crits, 0);
  const attacks = a.skills.reduce((s, k) => s + k.events, 0);
  const kpi = (l, v, sub) => `<div class="kpi"><small>${l}</small><b>${v}</b><span>${sub}</span></div>`;
  $('#kpis').innerHTML = [
    kpi('Mean DPS', `${fmt(dps)}${dtxt(delta(dps, pdps))}`, `${fmtK(a.p5 / a.seconds)} – ${fmtK(a.p95 / a.seconds)} between p5 and p95`),
    kpi(`Damage in ${a.seconds} s`, fmt(a.mean), `median ${fmt(a.p50)} · σ ${fmtK(a.sd)} (${pct(a.mean ? a.sd / a.mean : 0)})`),
    kpi('Burst · first 5 s', `${fmt(a.det.burst5sDps)}<span> DPS</span>`, 'expected value from the engine'),
    kpi('Crit rate · avg attack', `${pct(landed ? crits / landed : 0)}<span> · ${fmt(attacks ? a.mean / (attacks) : 0)}</span>`, 'average damage per attack includes misses'),
    kpi('Time to kill', dps > 0 ? spanText(a.target.maxHp / dps) : '—', `${fmt(a.target.maxHp)} HP · ${pct(a.mean / a.target.maxHp, a.mean / a.target.maxHp < 0.1 ? 2 : 0)} dealt in ${a.seconds} s`),
    kpi('Rotation', `${a.det.casts}<span> casts</span>`, `${a.det.autoSwings} basic attacks · ${a.det.groundTicks} ground ticks`),
  ].join('');
  $('#foot2').innerHTML = `<span>Engine expected value <b>${fmt(a.expected)}</b></span><span>Simulated mean <b>${fmt(a.mean)}</b> (${((a.mean / a.expected - 1) * 100).toFixed(2)}%)</span><span>${a.n.toLocaleString()} runs · seed ${a.seed}</span><span>Hit, 0.97–1.03 damage float and crit are rolled exactly like <b>CombatService.Damage</b>, hit by hit; triggered hits (Fear Breeze) are drawn per run. Cast timing is the engine’s deterministic rotation.</span>`;
  renderCharts();
    renderCompare();
    updateBadges();
  }

const CW = 560;
const CH = 250;
const M = { l: 56, r: 14, t: 18, b: 36 };
const IW = CW - M.l - M.r;
const IH = CH - M.t - M.b;
function niceTicks(lo, hi, n = 5) {
  const span = hi - lo || 1;
  const mag = 10 ** Math.floor(Math.log10(span / n));
  const f = span / n / mag;
  const step = (f < 1.5 ? 1 : f < 3 ? 2 : f < 7 ? 5 : 10) * mag;
  const out = [];
  for (let v = Math.ceil(lo / step) * step; v <= hi + step * 1e-9; v += step) out.push(+v.toFixed(10));
  return out;
}
function frame(xt, yt, X, Y, xf, yf) {
  let s = '';
  for (const v of yt) s += `<line x1="${M.l}" x2="${CW - M.r}" y1="${Y(v)}" y2="${Y(v)}" stroke="#c9bf9f" stroke-dasharray="3 4"/><text x="${M.l - 7}" y="${Y(v) + 4}" text-anchor="end">${yf(v)}</text>`;
  for (const v of xt) s += `<line x1="${X(v)}" x2="${X(v)}" y1="${M.t + IH}" y2="${M.t + IH + 4}" stroke="#7d7458"/><text x="${X(v)}" y="${M.t + IH + 17}" text-anchor="middle">${xf(v)}</text>`;
  return `${s}<line x1="${M.l}" x2="${CW - M.r}" y1="${M.t + IH}" y2="${M.t + IH}" stroke="#7d7458"/><line x1="${M.l}" x2="${M.l}" y1="${M.t}" y2="${M.t + IH}" stroke="#7d7458"/>`;
}
const svg = (label, defs, body) => `<svg viewBox="0 0 ${CW} ${CH}" role="img" aria-label="${label}"><defs>${defs}</defs>${body}</svg>`;
const GRAD = (id, a, b) => `<linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${a}"/><stop offset="1" stop-color="${b}"/></linearGradient>`;
const mark = (X, v, label, color, dash) => `<line x1="${X(v)}" x2="${X(v)}" y1="${M.t}" y2="${M.t + IH}" stroke="${color}" stroke-width="1.6"${dash ? ' stroke-dasharray="5 4"' : ''}/><text class="ttl" x="${X(v)}" y="${M.t - 5}" text-anchor="middle" style="fill:${color}">${label}</text>`;
function binSorted(sorted, lo, hi, B) {
  const c = new Float64Array(B);
  const w = (hi - lo) / B;
  for (const v of sorted) c[clamp(Math.floor((v - lo) / w), 0, B - 1)]++;
  return c;
}

function chartTotals(a, p) {
  let lo = Math.min(a.min, p ? p.min : Infinity);
  let hi = Math.max(a.max, p ? p.max : -Infinity);
  if (hi - lo < 1) { lo -= 1; hi += 1; }
  const pad = (hi - lo) * 0.04;
  lo = Math.max(0, lo - pad);
  hi += pad;
  const B = a.n < 600 ? 22 : 36;
  const bw = (hi - lo) / B;
  const sh = Array.from(binSorted(a.sorted, lo, hi, B), (v) => v / a.n);
  const ps = p ? Array.from(binSorted(p.sorted, lo, hi, B), (v) => v / p.n) : null;
  const ymax = Math.max(...sh, ...(ps ?? [0])) * 1.18 || 1;
  const X = (v) => M.l + ((v - lo) / (hi - lo)) * IW;
  const Y = (v) => M.t + IH - (v / ymax) * IH;
  let s = frame(niceTicks(lo, hi, 5).filter((v) => v >= lo && v <= hi), niceTicks(0, ymax, 4), X, Y, fmtK, (v) => pct(v, v < 0.1 ? 1 : 0));
  sh.forEach((v, i) => {
    const x0 = X(lo + i * bw);
    const x1 = X(lo + (i + 1) * bw);
    s += `<rect x="${(x0 + 0.5).toFixed(1)}" y="${Y(v).toFixed(1)}" width="${Math.max(1, x1 - x0 - 1).toFixed(1)}" height="${(M.t + IH - Y(v)).toFixed(1)}" fill="url(#gTot)" stroke="#9a6414" stroke-width=".6"/>`;
  });
  if (ps) s += `<path d="${ps.map((v, i) => `${i ? 'L' : 'M'}${X(lo + i * bw).toFixed(1)} ${Y(v).toFixed(1)}L${X(lo + (i + 1) * bw).toFixed(1)} ${Y(v).toFixed(1)}`).join('')}" fill="none" stroke="#1e2a3d" stroke-width="1.6" stroke-dasharray="5 3"/>`;
  s += mark(X, a.p5, 'p5', '#a5361f', true) + mark(X, a.p95, 'p95', '#a5361f', true) + mark(X, a.mean, `mean ${fmtK(a.mean)}`, '#1e2a3d', false);
  sh.forEach((v, i) => {
    s += `<rect x="${X(lo + i * bw).toFixed(1)}" y="${M.t}" width="${((IW / B)).toFixed(1)}" height="${IH}" fill="transparent" data-tip="${esc(`<b>${fmt(lo + i * bw)} – ${fmt(lo + (i + 1) * bw)}</b><br>${pct(v, 2)} of fights${ps ? `<br><span class='mut'>baseline ${pct(ps[i], 2)}</span>` : ''}`)}"/>`;
  });
  return svg('Distribution of total damage over the fight', GRAD('gTot', '#f8d26e', '#d98a1f'), s);
}

function chartHit(a) {
  const sk = a.skills.find((k) => k.id === view.hit) ?? a.skills[0];
  if (!sk) return '<p class="sub">No damage events in this rotation.</p>';
  const B = sk.normalBins.length;
  const span = sk.hi - sk.lo + 1;
  const bw = span / B;
  const att = sk.attempts || 1;
  const tot = Array.from(sk.normalBins, (v, i) => (v + sk.critBins[i]) / att);
  const ymax = Math.max(...tot) * 1.18 || 1;
  const X = (v) => M.l + ((v - sk.lo) / span) * IW;
  const Y = (v) => M.t + IH - (v / ymax) * IH;
  let s = frame(niceTicks(sk.lo, sk.lo + span, 5).filter((v) => v >= sk.lo && v <= sk.lo + span), niceTicks(0, ymax, 4), X, Y, fmtK, (v) => pct(v, v < 0.1 ? 1 : 0));
  for (let i = 0; i < B; i++) {
    const x0 = X(sk.lo + i * bw);
    const w = Math.max(1, X(sk.lo + (i + 1) * bw) - x0 - 1);
    const n = sk.normalBins[i] / att;
    const c = sk.critBins[i] / att;
    if (n) s += `<rect x="${(x0 + 0.5).toFixed(1)}" y="${Y(n).toFixed(1)}" width="${w.toFixed(1)}" height="${(M.t + IH - Y(n)).toFixed(1)}" fill="#5b8fb9" stroke="#2f5d84" stroke-width=".6"/>`;
    if (c) s += `<rect x="${(x0 + 0.5).toFixed(1)}" y="${Y(n + c).toFixed(1)}" width="${w.toFixed(1)}" height="${(Y(n) - Y(n + c)).toFixed(1)}" fill="#e8892f" stroke="#a8550f" stroke-width=".6"/>`;
    s += `<rect x="${x0.toFixed(1)}" y="${M.t}" width="${(IW / B).toFixed(1)}" height="${IH}" fill="transparent" data-tip="${esc(`<b>${fmt(sk.lo + i * bw)} – ${fmt(sk.lo + (i + 1) * bw - 1)}</b><br>normal ${pct(n, 2)} of attempts<br>crit ${pct(c, 2)} of attempts`)}"/>`;
  }
  return svg('Distribution of single hits', '', s);
}

function chartTime(a, p) {
  const T = a.seconds;
  const len = (src, b) => Math.min(src.bucketS, src.seconds - b * src.bucketS);
  const perB = (src, b) => src.skills.reduce((s, k) => s + k.perBucket[b], 0) / len(src, b);
  const stackMax = (src) => Math.max(...Array.from({ length: src.nb }, (_, b) => perB(src, b)));
  const X = (t) => M.l + (t / T) * IW;
  if (view.time === 'cum') {
    const xs = (src, b) => Math.min(src.seconds, b * src.bucketS);
    const ymax = Math.max(...a.cum.hi, ...(p ? p.cum.mean : [0])) * 1.08 || 1;
    const Y = (v) => M.t + IH - (v / ymax) * IH;
    let s = frame(niceTicks(0, T, 6), niceTicks(0, ymax, 4), X, Y, (v) => `${v}s`, fmtK);
    const up = Array.from({ length: a.nb + 1 }, (_, b) => `${X(xs(a, b)).toFixed(1)} ${Y(a.cum.hi[b]).toFixed(1)}`);
    const dn = Array.from({ length: a.nb + 1 }, (_, b) => `${X(xs(a, a.nb - b)).toFixed(1)} ${Y(a.cum.lo[a.nb - b]).toFixed(1)}`);
    s += `<polygon points="${[...up, ...dn].join(' ')}" fill="rgba(232,137,47,.28)" stroke="none"/>`;
    s += `<polyline points="${Array.from({ length: a.nb + 1 }, (_, b) => `${X(xs(a, b)).toFixed(1)} ${Y(a.cum.mean[b]).toFixed(1)}`).join(' ')}" fill="none" stroke="#c46f12" stroke-width="2.4"/>`;
    if (p) s += `<polyline points="${Array.from({ length: p.nb + 1 }, (_, b) => `${X(Math.min(T, xs(p, b))).toFixed(1)} ${Y(p.cum.mean[b]).toFixed(1)}`).join(' ')}" fill="none" stroke="#1e2a3d" stroke-width="1.8" stroke-dasharray="5 3"/>`;
    for (let b = 1; b <= a.nb; b++) {
      s += `<rect x="${(X(xs(a, b - 1))).toFixed(1)}" y="${M.t}" width="${(X(xs(a, b)) - X(xs(a, b - 1))).toFixed(1)}" height="${IH}" fill="transparent" data-tip="${esc(`<b>at ${+xs(a, b).toFixed(1)} s</b><br>mean ${fmt(a.cum.mean[b])}<br><span class='mut'>p5 ${fmt(a.cum.lo[b])} · p95 ${fmt(a.cum.hi[b])}</span>${p ? `<br><span class='mut'>baseline ${fmt(p.cum.mean[Math.min(p.nb, b)])}</span>` : ''}`)}"/>`;
    }
    return svg('Cumulative damage over time', '', s);
  }
  const ymax = Math.max(stackMax(a), p ? stackMax(p) : 0) * 1.18 || 1;
  const Y = (v) => M.t + IH - (v / ymax) * IH;
  let s = frame(niceTicks(0, T, 6), niceTicks(0, ymax, 4), X, Y, (v) => `${v}s`, fmtK);
  for (let b = 0; b < a.nb; b++) {
    const x0 = X(b * a.bucketS);
    const x1 = X(Math.min(T, (b + 1) * a.bucketS));
    const l = len(a, b);
    let acc = 0;
    let tip = '';
    for (const k of a.skills) {
      const v = k.perBucket[b] / l;
      if (v > 0) {
        s += `<rect x="${(x0 + 0.5).toFixed(1)}" y="${Y(acc + v).toFixed(1)}" width="${Math.max(1, x1 - x0 - 1).toFixed(1)}" height="${(Y(acc) - Y(acc + v)).toFixed(1)}" fill="${k.color}"/>`;
        tip += `<br><span style='color:${k.color}'>■</span> ${esc(k.name)} ${fmt(v)}`;
      }
      acc += v;
    }
    s += `<rect x="${x0.toFixed(1)}" y="${M.t}" width="${(x1 - x0).toFixed(1)}" height="${IH}" fill="transparent" data-tip="${esc(`<b>${+(b * a.bucketS).toFixed(1)} – ${+Math.min(T, (b + 1) * a.bucketS).toFixed(1)} s</b> · ${fmt(acc)} dmg/s${tip}`)}"/>`;
  }
  s += `<line x1="${M.l}" x2="${CW - M.r}" y1="${Y(a.mean / T)}" y2="${Y(a.mean / T)}" stroke="#1e2a3d" stroke-width="1.4" stroke-dasharray="6 4"/><text class="ttl" x="${CW - M.r - 4}" y="${Y(a.mean / T) - 5}" text-anchor="end">mean ${fmtK(a.mean / T)}/s</text>`;
  if (p) s += `<polyline points="${Array.from({ length: p.nb }, (_, b) => `${X(Math.min(T, (b + 0.5) * p.bucketS)).toFixed(1)} ${Y(perB(p, b)).toFixed(1)}`).join(' ')}" fill="none" stroke="#1e2a3d" stroke-width="1.8" stroke-dasharray="4 3"/>`;
  return svg('Damage per second by skill', '', s);
}

function skillTable(a) {
  return `<table class="tbl"><thead><tr><th>Skill</th><th>Hits</th><th>Avg / hit</th><th>Hit</th><th>Crit</th><th>Damage</th><th>Share</th></tr></thead><tbody>${a.skills.map((k) => `
    <tr><td class="nm"><i style="background:${k.color}"></i>${esc(k.name)}</td><td>${+(k.landed / a.n).toFixed(1)}</td><td>${fmt(k.landed ? k.total * a.n / k.landed : 0)}</td><td>${pct(k.hitPct, 0)}</td><td>${k.magic ? '<span title="Magic cannot crit">—</span>' : pct(k.critPct, 1)}</td><td>${fmt(k.total)}</td>
    <td><div class="share"><span style="width:${(k.share * 90).toFixed(0)}px;background:${k.color}"></span>${pct(k.share, 1)}</div></td></tr>`).join('')}</tbody></table>`;
}

// Rotation timeline from the engine's cast log: a lane per skill, a bar per cast (the whole animation the character is locked for, so
// nothing else can start inside it), a tick where each hit lands, a diamond for hits another skill triggers, a dot for chance procs.
function chartRotation(a) {
  const T = Math.min(view.tl, a.seconds);
  const log = a.det.castLog.filter((c) => c.t < T * 1000);
  const rank = { cast: 0, auto: 0, pet: 1, follow: 1, proc: 2, buff: 3 };
  const kindOf = (n) => log.find((c) => c.name === n).kind;
  const lanes = [...new Set(log.map((c) => c.name))].sort((x, y) => rank[kindOf(x)] - rank[kindOf(y)]);
  const W = 1120;
  const ML = 176;
  const MR = 16;
  const MT = 6;
  const LH = 26;
  const H = MT + lanes.length * LH + 28;
  const X = (ms) => ML + (Math.min(ms, T * 1000) / 1000 / T) * (W - ML - MR);
  const colorOf = (n) => a.skills.find((k) => k.name === n)?.color ?? '#8a8670';
  const sec = (ms) => +(ms / 1000).toFixed(2);
  let s = '';
  for (const v of niceTicks(0, T, Math.min(T, 10))) s += `<line x1="${X(v * 1000)}" x2="${X(v * 1000)}" y1="${MT}" y2="${H - 28}" stroke="#c9bf9f" stroke-dasharray="3 4"/><text x="${X(v * 1000)}" y="${H - 11}" text-anchor="middle">${v}s</text>`;
  lanes.forEach((name, i) => {
    const y = MT + i * LH;
    const col = colorOf(name);
    s += `<line x1="${ML}" x2="${W - MR}" y1="${y + LH}" y2="${y + LH}" stroke="#d7cfb4"/><text x="${ML - 8}" y="${y + LH / 2 + 4}" text-anchor="end"><title>${esc(name)}</title>${esc(name.length > 27 ? `${name.slice(0, 26)}…` : name)}</text>`;
    for (const c of log.filter((x) => x.name === name)) {
      if (c.kind === 'buff') {
        const x0 = X(c.t);
        s += `<rect x="${x0.toFixed(1)}" y="${y + 5}" width="${Math.max(1, X(c.t + c.durMs) - x0 - 1).toFixed(1)}" height="${LH - 10}" rx="2" fill="#8f7bcc" fill-opacity=".45" stroke="#6544b8" data-tip="${esc(`<b>${esc(name)}</b><br>up from ${sec(c.t)} s to ${sec(c.t + c.durMs)} s: ${esc(c.attrs.map(([id, v]) => attrText(id, v)).join(', '))}`)}"/>`;
        continue;
      }
      if (c.kind === 'follow' || c.kind === 'proc' || c.kind === 'pet') {
        for (const h of c.hits.length ? c.hits : [c.t]) {
          const x = X(h);
          const tip = c.kind === 'pet' ? `<b>${esc(name)}</b><br>independent Primary cast at ${sec(c.t)} s; ${c.hits.length ? `hit lands at ${sec(h)} s` : 'no direct damage'}; no character lock`
            : c.kind === 'follow' ? `<b>${esc(name)}</b><br>triggered by a cast, lands at ${sec(h)} s` : c.prob < 1 ? `<b>${esc(name)}</b><br>${pct(c.prob, 0)} chance, expected hit at ${sec(h)} s` : `<b>${esc(name)}</b><br>triggered hit at ${sec(h)} s`;
          s += c.kind === 'follow'
            ? `<path d="M${x} ${y + LH / 2 - 7}l7 7-7 7-7-7z" fill="${col}" stroke="#2c2a25" stroke-width="1" data-tip="${esc(tip)}"/>`
            : `<circle cx="${x}" cy="${y + LH / 2}" r="3.5" fill="${col}" fill-opacity=".7" data-tip="${esc(tip)}"/>`;
        }
        continue;
      }
      const x0 = X(c.t);
      const x1 = X(c.t + c.lockMs);
      const tip = `<b>${esc(name)}</b> · cast at ${sec(c.t)} s<br>busy ${sec(c.lockMs)} s, free again at ${sec(c.t + c.lockMs)} s${c.fullMs > c.lockMs ? `<br><span class='mut'>animation ${sec(c.fullMs)} s: ${sec(c.fullMs - c.lockMs)} s skipped by cancelling</span>` : ''}<br>${c.hits.length} hit${c.hits.length > 1 ? 's' : ''} at ${c.hits.map(sec).join(', ')} s`;
      if (c.fullMs > c.lockMs) s += `<rect x="${x1.toFixed(1)}" y="${y + 6}" width="${Math.max(0, X(c.t + c.fullMs) - x1).toFixed(1)}" height="${LH - 12}" fill="none" stroke="${col}" stroke-dasharray="2 2" opacity=".7" pointer-events="none"/>`;
      s += `<rect x="${x0.toFixed(1)}" y="${y + 5}" width="${Math.max(1, x1 - x0 - 1).toFixed(1)}" height="${LH - 10}" rx="2" fill="${col}" fill-opacity=".55" stroke="${col}" data-tip="${esc(tip)}"/>`;
      for (const h of c.hits) s += `<line x1="${X(h).toFixed(1)}" x2="${X(h).toFixed(1)}" y1="${y + 3}" y2="${y + LH - 3}" stroke="#2c2a25" stroke-width="1.6" pointer-events="none"/>`;
    }
  });
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Rotation timeline: when each skill is cast and when its hits land">${s}</svg>`;
}

function renderCharts() {
  const a = last;
  const p = reference();
  if (!a) return;
  const T = Math.min(view.tl, a.seconds);
  const busyMs = a.det.castLog.filter((c) => c.lockMs && c.t < T * 1000).reduce((n, c) => n + Math.min(c.lockMs, T * 1000 - c.t), 0);
  const nCasts = a.det.castLog.filter((c) => c.lockMs && c.t < T * 1000).length;
  $('#chRot').innerHTML = `<div class="ch"><h3>Rotation timeline</h3><span class="gap"></span><div class="seg">${[10, 20, 30].map((v) => `<button class="${view.tl === v ? 'on' : ''}" data-act="tlview" data-v="${v}">${v} s</button>`).join('')}</div></div>
    <p class="sub">First ${T} s of the fight: ${nCasts} casts, the character busy <b>${pct(busyMs / (T * 1000), 0)}</b> of the time. A bar is one cast and everything inside it is locked out; a tick is a hit landing${a.det.castLog.some((c) => c.fullMs > c.lockMs) ? '; a dashed box is backswing skipped by cancelling' : ''}.</p>${chartRotation(a)}
    <div class="leg"><span><i style="background:#c9a15a"></i>Cast (animation lock)</span><span><i style="background:#2c2a25;width:3px"></i>Hit lands</span><span>◆ Triggered by another skill (Warg Strike, wolf followers)</span><span>● Proc or pet hit (Fear Breeze, pet passives)</span>${a.det.castLog.some((c) => c.kind === 'buff') ? `<span><i style="background:#8f7bcc"></i>Timed buff on you (${[...new Set(a.det.castLog.filter((c) => c.kind === 'buff').map((c) => c.name))].map(esc).join(', ')})</span>` : ''}</div>`;
  if (!a.skills.some((k) => k.id === view.hit)) view.hit = a.skills[0]?.id ?? 0;
  const sk = a.skills.find((k) => k.id === view.hit);
  const pinKey = p ? `<div class="leg"><span><i style="background:#d98a1f"></i>current</span><span><i style="border:1.5px dashed #1e2a3d;background:none"></i>${referenceName()}</span></div>` : '';
  $('#chTotals').innerHTML = `<div class="ch"><h3>Total damage distribution</h3></div><p class="sub">${a.n.toLocaleString()} simulated ${a.seconds}-second fights: 90% land between <b>${fmt(a.p5)}</b> and <b>${fmt(a.p95)}</b>.</p>${chartTotals(a, p)}${pinKey}`;
  $('#chTime').innerHTML = `<div class="ch"><h3>Damage over time</h3><span class="gap"></span><div class="seg"><button class="${view.time === 'sec' ? 'on' : ''}" data-act="timeview" data-v="sec">Per second</button><button class="${view.time === 'cum' ? 'on' : ''}" data-act="timeview" data-v="cum">Cumulative</button></div></div>
    <p class="sub">${view.time === 'sec' ? 'Mean damage per second, stacked by skill: shows how the rotation spends its cooldowns.' : 'Mean cumulative damage with the p5–p95 band across fights.'}</p>${chartTime(a, p)}
    ${view.time === 'sec' ? `<div class="leg">${a.skills.map((k) => `<span><i style="background:${k.color}"></i>${esc(k.name)}</span>`).join('')}</div>` : ''}`;
  $('#chHit').innerHTML = `<div class="ch"><h3>Single-hit damage</h3><span class="gap"></span><select class="sel" id="hitSel" aria-label="Skill">${a.skills.map((k) => `<option value="${k.id}"${k.id === view.hit ? ' selected' : ''}>${esc(k.name)}</option>`).join('')}</select></div>
    <p class="sub">${sk ? `Normal <b>${pct(sk.landed ? sk.hits / sk.attempts : 0)}</b> · Crit <b>${pct(sk.landed ? sk.crits / sk.attempts : 0)}</b> · Miss <b>${pct(sk.attempts ? sk.misses / sk.attempts : 0)}</b> of attempts. The spread is the ±3% damage float${sk?.magic ? '' : '; the right hump is the ×1.5 crit'}.` : ''}</p>${chartHit(a)}
    <div class="leg"><span><i style="background:#5b8fb9"></i>Normal hit</span><span><i style="background:#e8892f"></i>Critical hit</span></div>`;
  $('#chSkills').innerHTML = `<div class="ch"><h3>Damage by skill</h3></div><p class="sub">Average per run over ${a.seconds} s. “Hits” counts landed damage instances, including criticals and each multi-hit or ground-effect tick; misses and procs that did not trigger are excluded.</p>${skillTable(a)}`;
}

/* ---------- build tabs ---------- */
const colorOf = (id) => PALETTE[(id - 1) % PALETTE.length];
const dpsOf = (id) => {
  const a = results.get(id)?.a;
  return a ? a.mean / a.seconds : null;
};
const buildTip = (b) => {
  const a = results.get(b.id)?.a;
  const st = b.state;
  return `<b>${esc(b.name)}</b><br>${esc(jobs.get(st.job)?.name ?? '')}${profById(st.job, st.prof) ? ` · ${esc(profById(st.job, st.prof).name)}` : ''} · Lv ${st.level}<br>${esc(st.target.name)} · ${st.sim.seconds} s fight${a ? `<br>${fmt(a.mean / a.seconds)} DPS <span class="mut">(${fmtK(a.p5 / a.seconds)} – ${fmtK(a.p95 / a.seconds)})</span>` : ''}${b.id === book.baseline ? '<br><span class="mut">Baseline: the other tabs are compared with this one.</span>' : ''}<br><span class="mut">Click to open · double-click the name to rename</span>`;
};
const uniqueName = (base) => {
  let n = base.slice(0, 28);
  for (let i = 2; book.builds.some((b) => b.name === n); i++) n = `${base.slice(0, 24)} ${i}`;
  return n;
};

function renderBuilds() {
  renderBuildOverview();
  const full = book.builds.length >= MAX_BUILDS;
  $('#builds').innerHTML = book.builds.map((b) => `<div class="btab${b.id === book.active ? ' on' : ''}" role="tab" aria-selected="${b.id === book.active}" tabindex="0" data-act="bgo" data-id="${b.id}" data-tip="${esc(buildTip(b))}">
      <i class="dot" style="background:${colorOf(b.id)}"></i><span class="nm">${esc(b.name)}</span>${b.id === book.baseline ? '<i class="base" aria-label="Baseline">◆</i>' : ''}<small class="bdps"></small>${book.builds.length > 1 ? `<button class="bx" data-act="bx" data-id="${b.id}" aria-label="Close ${esc(b.name)}">×</button>` : ''}</div>`).join('')
    + `<button class="btab add" data-act="bnew" ${full ? 'disabled' : ''} data-tip="${esc(full ? `At most ${MAX_BUILDS} tabs: close one first.` : '<b>New tab</b><br>Copies the build on screen. Change something in the copy and every tab shows its DPS, compared with the baseline.')}" aria-label="New build tab">+</button>`
    + `<select class="btab tpl" id="tplSel" ${full ? 'disabled' : ''} aria-label="New tab from a profession template" data-tip="${esc(full ? `At most ${MAX_BUILDS} tabs: close one first.` : '<b>New tab from a template</b><br>Pick a profession (Speedy Hunter, Warg Hunter…): the new tab gets its skills, rotation, wolf and suggested pets. An Advanced or Basic build also fills the card sockets with the cards the game suggests (at 3 ★ Lv 15) and spends the points on the two stats the game recommends. Your gear, target and settings carry over when it is the same class.')}">${TEMPLATE_OPTIONS}</select>`;
  updateBadges();
     $('.btab.on')?.scrollIntoView({ block: 'nearest', inline: 'nearest' });
}
// The DPS on every tab (green or red against the baseline), refreshed in place so a name being edited is left alone.
function updateBadges() {
  const base = dpsOf(book.baseline);
  for (const b of book.builds) {
    const el = $(`.btab[data-id="${b.id}"]`);
    const badge = el?.querySelector('.bdps');
    if (!badge) continue;
    const dps = dpsOf(b.id);
    const d = dps !== null && base && b.id !== book.baseline ? delta(dps, base) : null;
    badge.textContent = dps === null ? '…' : fmt(dps);
    badge.className = `bdps${d === null ? '' : d >= 0 ? ' up' : ' down'}`;
    el.dataset.tip = buildTip(b);
  }
}

// Every tab side by side: mean DPS (with its p5 - p95 range), the difference to the baseline tab, burst and the fight it was run on.
function renderCompare() {
  const el = $('#chCmp');
  if (!el || document.activeElement?.id === 'baseSel') return;
  if (book.builds.length < 2) {
    el.innerHTML = '<div class="ch"><h3>Build comparison</h3></div><p class="sub">Press <b>+</b> in the tab bar to copy this build into a new tab. Change something in the copy (a stat, a skill, the rotation, the target…) and the DPS of every tab is compared here, side by side. Tabs are saved in this browser.</p>';
    return;
  }
  const rows = book.builds.map((b) => ({ b, a: results.get(b.id)?.a, dps: dpsOf(b.id) }));
  const base = rows.find((r) => r.b.id === book.baseline);
  const top = Math.max(1, ...rows.map((r) => r.dps ?? 0));
  const body = rows.map(({ b, a, dps }) => {
    const st = b.state;
    const like = !base?.a || !a || (a.seconds === base.a.seconds && st.target.name === base.b.state.target.name);
    return `<tr class="${b.id === book.active ? 'on' : ''}">
      <td class="nm"><i style="background:${colorOf(b.id)}"></i><button data-act="bgo" data-id="${b.id}" data-tip="Open this tab">${esc(b.name)}</button><small>${esc(jobs.get(st.job)?.name ?? '')} Lv ${st.level}</small></td>
      <td>${a ? `<div class="share"><span style="width:${Math.max(2, (dps / top) * 150).toFixed(0)}px;background:${colorOf(b.id)}"></span><b>${fmt(dps)}</b></div>` : '…'}</td>
      <td>${b.id === book.baseline ? '<span class="mut">baseline</span>' : base?.dps && dps !== null ? dtxt(delta(dps, base.dps)) : ''}</td>
      <td>${a ? `${fmtK(a.p5 / a.seconds)} – ${fmtK(a.p95 / a.seconds)}` : ''}</td>
      <td>${a ? fmt(a.det.burst5sDps) : ''}</td>
      <td class="${like ? '' : 'warn'}"${like ? '' : ' data-tip="A different target or fight length than the baseline: the DPS is real, but not like for like."'}>${esc(st.target.name)} · ${st.sim.seconds} s</td></tr>`;
  }).join('');
  el.innerHTML = `<div class="ch"><h3>Build comparison</h3><span class="gap"></span><span class="hint">Baseline</span><select class="sel" id="baseSel" aria-label="Baseline build"><option value="">None</option>${book.builds.map((b) => `<option value="${b.id}"${b.id === book.baseline ? ' selected' : ''}>${esc(b.name)}</option>`).join('')}</select></div>
    <p class="sub">Each tab is simulated with its own class, stats, skills, rotation, target and settings. Click a name to open it. ▲ ▼ are the DPS difference to the baseline, which the open tab's charts are also compared with.</p>
    <table class="tbl cmp"><thead><tr><th>Build</th><th>Mean DPS</th><th>vs baseline</th><th>p5 – p95</th><th>Burst · 5 s</th><th>Target · fight</th></tr></thead><tbody>${body}</tbody></table>`;
}

function switchBuild(id) {
  const b = buildById(id);
  if (!b || id === book.active) return;
  book.active = id;
  S = b.state;
  tab = S.job;
  renderBuilds();
  refresh({ sim: false });
  const hit = results.get(id);
  if (hit?.a && hit.key === stateKey(S)) {
    last = hit.a;
    renderReport();
  } else {
    schedule();
  }
}
// A new tab starts as a copy of the open one, so the two differ only by what you change next.
function newBuild() {
  if (book.builds.length >= MAX_BUILDS) return;
  const src = buildById(book.active);
  const id = book.next++;
  book.builds.push({ id, name: uniqueName(`${src.name.replace(/ copy( \d+)?$/, '')} copy`), state: JSON.parse(JSON.stringify(src.state)) });
  book.baseline ??= src.id;
  const done = results.get(src.id);
  if (done) results.set(id, { ...done });
  switchBuild(id);
}
function closeBuild(id) {
  const b = buildById(id);
  if (!b || book.builds.length < 2 || !confirm(`Close "${b.name}"? Its setup is deleted.`)) return;
  const i = book.builds.indexOf(b);
  book.builds.splice(i, 1);
  results.delete(id);
  if (book.baseline === id) book.baseline = null;
  if (book.active === id) {
    book.active = 0; // so switchBuild opens the neighbouring tab instead of returning early
    switchBuild(book.builds[Math.min(i, book.builds.length - 1)].id);
  } else {
    save();
    renderBuilds();
    renderSplits();
    renderReport();
  }
}
function renameBuild(id, name) {
  const b = buildById(id);
  const n = name.trim().slice(0, 28);
  if (b && n) b.name = n;
  save();
  renderBuilds();
  renderCompare();
}

/* ---------- import character ---------- */
// The game's own data, as ro3-export-character.cs (Unity Explorer) wrote it to ro3-character.json, turned into a build. The shapes of the
// game's tables come from its client and server files, not from a live dump, so every part says what it took (✓), took in part (–) or could
// not take (✗) instead of failing. A Lua list and a Lua map both arrive as an object keyed by the Lua key (a list is "1", "2", ...).
const imp = { on: false };
const impObj = (v) => (v && typeof v === 'object' ? v : {});
const impEnts = (v) => Object.entries(impObj(v)).sort((a, b) => (a[0] - b[0]) || 0);
const impVals = (v) => impEnts(v).map(([, x]) => x);
const impNum = (...v) => v.map((x) => (x === null || x === '' || typeof x === 'object' ? NaN : Number(x))).find(Number.isFinite);
// The plan a table of plans names as current: [key, plan] (the first one when it is not named).
function impPlan(plans, cur) {
  const keys = Object.keys(impObj(plans)).sort((a, b) => a - b);
  const key = String(cur) in impObj(plans) ? String(cur) : keys[0];
  return [key, impObj(impObj(plans)[key])];
}
// ServerAllSkills is the game's own { skill: level } of the open skill plan; the plan list is the fallback (a list is 1-based, its index is not).
function impSkills(st, A, say) {
  let levels = impObj(A.ServerAllSkills);
  if (!Object.keys(levels).length) {
    const d = impObj(A.ServerSkillDevelopInfo);
    const plan = impObj(impObj(d.skillAssignPlans)[(impNum(d.currentPlanIndex) ?? 0) + 1]);
    levels = Object.fromEntries(impEnts(plan.skillAssigns).map(([k, s]) => [impNum(impObj(s).skillId) ?? k, impNum(impObj(s).skillLevel) ?? 0]));
  }
  const skills = Object.fromEntries(Object.keys(defaultSkills(st.job)).map((g) => [g, 0]));
  const isSeason = (g) => SEASON_SKILLS.some(([s]) => s === g);
  const season = [];
  let learned = 0;
  for (const [k, v] of Object.entries(levels)) {
    const g = groups.has(+k) || isSeason(+k) ? +k : Math.floor(k / 100); // the group, or a row id (group * 100 + level)
    const lv = impNum(v) ?? 0;
    if (lv > 0 && g in skills && groups.has(g)) { skills[g] = clamp(Math.round(lv), 0, groups.get(g).max); learned++; }
    else if (lv > 0 && isSeason(g) && chainOf(st.job).some((j) => j.id === SEASON_JOB)) { skills[g] = 1; season.push(SEASON_SKILLS.find(([s]) => s === g)[1]); }
  }
  if (!learned) return say('warn', 'Skills: none recognised, so every skill of the class stays at its top level.');
  st.skills = skills;
  say('ok', `Skills: ${learned} learned${season.length ? `, and the Season skills ${season.map(esc).join(', ')}` : ''}.`);
}
// The skill bar (the open skill plan's manual slots) in the game's order: its auto-battle goes round it, casting the next skill that is ready, so it is the
// rotation, in Cycle order. Buff skills are auto-cast (the bar's buff combo is not a rotation step).
function impRotation(st, A, say) {
  const d = impObj(A.ServerSkillDevelopInfo);
  const plan = impObj(impObj(d.skillAssignPlans)[(impNum(d.currentPlanIndex) ?? 0) + 1]);
  const bar = impVals(plan.manualLoadSkill).map((s) => impNum(impObj(s).skillId));
  const list = bar.filter((g) => groups.get(g)?.usable && (st.skills[g] | 0) > 0 && inChain(g, st.job));
  if (!list.length) return say('warn', 'Rotation: no damage skill of the skill bar is one this planner knows, so the class rotation stays.');
  st.rotation = list;
  st.sim.cycle = 1;
  say('ok', `Rotation: your skill bar in the game's order (${list.map((g) => esc(groups.get(g).name)).join(', ')}), cycled like its auto-battle. Add a skill twice in the Rotation window if your auto-battle casts it twice per round.`);
}
function impGear(st, A, say) {
  const worn = impObj(A.EquipGearDataMap);
  const grids = impObj(impObj(A.EquipStrengthenData).kEquipStrengthenGridData);
  const twoHanded = gearItem(impNum(impObj(worn[1]).iItemId))?._iEquipPart === 1; // the client lists it in the off-hand grid as well
  const names = [], left = [];
  let off = 0, enchants = 0;
  st.gear.forEach((g, i) => {
    const lv = impObj(grids[i + 1]);
    [g.refine, g.enh] = [impNum(lv.iRefineLevel) ?? 0, impNum(lv.iStrengthenLevel) ?? 0];
    const raw = impObj(worn[i + 1]);
    const id = impNum(raw.iItemId);
    const it = gearItem(id);
    if (!id || (i === 1 && twoHanded)) return;
    if (!it || !TIERS.includes(it.rank) || !GRIDS[i].parts.includes(it._iEquipPart) || !gearUsable(it, st.job)) {
      left.push(`${GRIDS[i].name}: ${it ? `${it.name} (T${it.rank})` : `item ${id}`}`);
      return;
    }
    const info = impObj(raw.kEquipInfo);
    const p = gearParts({ grid: i + 1, id, roll: 5000, affixes: [], stunts: [] }, data);
    // The planner keeps one roll per item (0-10000 of its range): where the rolled values sit in their ranges, averaged.
    const pos = [];
    for (const r of impVals(info.kPropertyList)) {
      const b = p.base.find((x) => x.attr === impNum(r.iId));
      if (b && b.max > b.min) pos.push((impNum(r.iValue) - b.min) / (b.max - b.min));
    }
    for (const e of impVals(info.kEntryList)) {
      const row = p.pool.find((x) => x._iAttriID === impNum(e.iId));
      if (row && row._iMax > row._iMin) pos.push((impNum(e.iValue) - row._iMin) / (row._iMax - row._iMin));
    }
    const fits = pos.length > 0 && pos.every((x) => x >= -0.02 && x <= 1.02);
    if (pos.length && !fits) off++;
    Object.assign(g, {
      id, rank: it.rank, q: it._iQuality, roll: fits ? clamp(Math.round((pos.reduce((s, x) => s + x, 0) / pos.length) * 10000), 0, 10000) : rollOf('mid', it._iQuality),
      aff: impVals(info.kEntryList).map((e) => impNum(e.iId)).filter(Boolean).slice(0, 2), sp: [0, 0],
    });
    for (const s of impVals(info.kSpecialList)) {
      const k = p.pools.findIndex((pool, n) => !g.sp[n] && pool.includes(impNum(s.iId)));
      if (k >= 0) g.sp[k] = impNum(s.iId);
    }
    enchants += impVals(info.kEnchantList).length;
    names.push(`${GRIDS[i].name}: ${it.name}`);
  });
  const notes = [];
  if (left.length) notes.push(`Not a tier 5-7 item of your class, left empty: ${left.map(esc).join('; ')}.`);
  if (off) notes.push(`${off} item${off > 1 ? 's' : ''} had rolled values outside the item's ranges (another unit?), so Mid is used.`);
  if (enchants) notes.push(`${enchants} enchant${enchants > 1 ? 's are' : ' is'} not modeled.`);
  if (!names.length && !left.length) return say('warn', 'Gear: no worn items found.');
  say(left.length || off ? 'warn' : 'ok', `Gear: ${names.length} worn, with the Refine / Enhance levels of all 7 grids${names.length ? ` (${names.map(esc).join('; ')})` : ''}. ${notes.join(' ')}`);
}
// The sockets of the open card plan: the slot records say which card (ItemId, StarLevel, treasured = card type), the pack record under the same keys has its level.
function impCards(st, A, say, flashType) {
  const map = impObj(A.EquipGridCardMap);
  const [key, plan] = impPlan(map.storagePlans, impNum(map.currentPlan));
  const pack = impObj(impObj(impObj(map.storagePack)[key]).cardInfo);
  const put = [], left = [];
  let guessed = 0;
  for (const [gk, grp] of impEnts(plan.cardInfo)) {
    for (const [sk, rec] of impEnts(impObj(grp).cardSlotInfo ?? grp)) {
      const id = impNum(impObj(rec).ItemId, impObj(rec).iItemId);
      if (!id) continue;
      const card = cardItem(id);
      if (!card?._iCardPart) { left.push(`card ${id}`); continue; }
      const held = impObj(pack[gk])[sk] ?? impObj(impObj(pack[gk]).cardSlotInfo)[sk];
      const kind = impObj(impObj(held).kCardInfo);
      const star = clamp(Math.round(impNum(rec.StarLevel, kind.iCardStar) ?? 3), 0, 3);
      const lv = impNum(kind.iCardLevel);
      const i = st.cards.findIndex((c, n) => !c.id && SOCKETS[n].part === card._iCardPart);
      if (i < 0) { left.push(`${cardName(id)} (no free ${SLOT[card._iCardPart]} socket)`); continue; }
      st.cards[i] = { id, star, lv: lv ?? CARD_CAP[star], flash: impNum(rec.treasured, kind.iCardType) === flashType };
      if (lv === undefined) guessed++;
      put.push(cardName(id));
    }
  }
  if (!put.length && !left.length) return say('warn', 'Cards: no slotted cards found.');
  say(left.length || guessed ? 'warn' : 'ok', `Cards: ${put.length} slotted (${put.map(esc).join('; ')}).${left.length ? ` Left out: ${left.map(esc).join('; ')}.` : ''}${guessed ? ` ${guessed} had no level in the file, so the top level of their star is used.` : ''}`);
}
// Fight pets (setUpPets) and support pets (supportPets) by slot; the pet records are the client's own (m_iStar, m_iStarProgress, m_iLevel).
function impPets(st, A, say) {
  const info = impObj(A.PetInfo);
  const list = new Map(impVals(info.m_kPetList ?? info.listPet).map((p) => [impNum(p.m_iPetId, p.petId), impObj(p)]));
  const setup = impObj(A.PetSetUpInfo);
  let plan = impPlan(setup.setupPlans, impNum(setup.currentPlan))[1];
  if (Object.keys(impObj(setup.setupPlans)).length && !Object.hasOwn(setup.setupPlans, String(setup.currentPlan))) {
    say('no', 'Pets: the selected plan is missing; another plan was not substituted.');
    plan = { setUpPets: {}, supportPets: {} };
  }
  const slots = (m) => {
    const e = impEnts(m);
    const base = e.length && +e[0][0] === 0 ? 0 : 1;
    return e.map(([k, id]) => [+k - base, impNum(id)]);
  };
  const rank = (p) => ({ ...fixRank({ star: impNum(p.m_iStar, p.star), stage: impNum(p.m_iStarProgress, p.starProgress) }), lv: fixLevel(impNum(p.m_iLevel, p.level)) });
  let fight = 0, support = 0;
  const left = [];
  for (const [i, id] of slots(plan.setUpPets ?? setup.m_kPetSetUpInfo)) {
    if (!id) continue;
    if (!petById(id) || !list.has(id) || i < 0 || i > 3) { left.push(`pet ${id}`); continue; }
    st.pets[i] = { id, ...rank(list.get(id)) };
    fight++;
  }
  for (const [i, id] of slots(plan.supportPets ?? setup.m_kPetSupportInfo)) {
    if (!id) continue;
    if (!GROWTH[petById(id)?.g] || !list.has(id) || i < 0 || i > 4) { left.push(`pet ${id}`); continue; }
    st.assist[i] = { g: petById(id).g, ...rank(list.get(id)), sourceId: id };
    support++;
  }
  if (!fight && !support && !left.length) say('warn', 'Pets: none deployed (or not found).');
  say(left.length ? 'warn' : 'ok', `Pets: ${fight} deployed, ${support} support.${left.length ? ` Not known to the planner: ${left.join(', ')}.` : ''}`);
  let collected = 0;
  for (const [id, p] of list) {
    const activated = p.m_bIsActiveCollect ?? p.isActiveCollect;
    if (activated !== true && activated !== 1) continue;
    const key = `${id}:${impNum(p.m_iStar, p.star)}:${impNum(p.m_iStarProgress, p.starProgress)}`;
    const row = D.tables.PetCollection[key];
    if (!row) { say('warn', `Pet collection: no configured star/stage row for pet ${id}.`); continue; }
    st.petCollect.push(...row.attrs);
    collected++;
  }
  if (collected) say('ok', `Pet collection: ${collected} activated pets captured; configured collection attributes are included.`);
}
// Resolve only the explicitly selected snapshot plan; never silently substitute a different build.
function impLoadout(A, key, say) {
  const source = impObj(A[key]);
  const plans = impObj(source.plans);
  if (!Number.isInteger(source.currentPlan) || !Object.hasOwn(plans, String(source.currentPlan))) {
    say('warn', `${key}: selected loadout not captured; its contribution stays in the panel remainder.`);
    return [];
  }
  const items = impObj(source.items), used = new Set(), out = [];
  for (const [slot, ref] of impEnts(impObj(plans[source.currentPlan]).slots)) {
    if (!Number.isInteger(+slot) || +slot < 1 || typeof ref !== 'string' || used.has(ref) || !Object.hasOwn(items, ref)) {
      say('warn', `${key}: invalid, duplicated or unresolved slot ${esc(slot)} was omitted.`);
      continue;
    }
    used.add(ref);
    out.push({ slot: +slot, ref, item: impObj(items[ref]) });
  }
  return out;
}
function impEchoes(st, A, say) {
  if (!A.SoulEchoes) return say('warn', 'Soul Echoes: not captured by this file; included only through the game-panel remainder.');
  const rows = impLoadout(A, 'SoulEchoes', say);
  st.echoes = emptyEchoes();
  let skipped = 0;
  let missingLevels = 0;
  let fits = true;
  for (const { slot, item } of rows) {
    const info = impObj(item.kEmblemInfo);
    const stats = [];
    for (const p of [...impVals(info.kAttrList), ...impVals(info.kSubAttrList)]) {
      const id = impNum(p.iId), value = impNum(p.iValue);
      if (!D.tables.AttributeConfig[id] || value === undefined) { skipped++; continue; }
      st.echoAttrs.push([id, value]);
      stats.push({ a: id, v: value });
    }
    if (slot > 5) { fits = false; continue; }
    const level = impNum(info.iLevel, info.iLv);
    if (level === undefined) missingLevels++;
    st.echoes[slot - 1] = { ...emptyEcho(), id: impNum(item.iItemId) || -1, lv: level ?? 0, stats };
  }
  st.echoes = fixEchoes(st.echoes);
  st.echoUseEntries = fits;
  const partial = rows.some(({ item }) => impVals(impObj(item.kEmblemInfo).kMarkList).length || impVals(impObj(item.kEmblemInfo).kSpecialEffectList).length);
  say(skipped || partial || !fits || missingLevels ? 'warn' : 'ok', `Soul Echoes: ${rows.length} deployed instances, ${st.echoAttrs.length} rolled attributes included.${skipped ? ` ${skipped} unknown attributes omitted.` : ''}${fits ? ' Per-Echo bonuses are editable.' : ' More than five slots: the captured aggregate is retained instead.'}${missingLevels ? ` ${missingLevels} reference levels were not captured: they start at 0 for color planning; their stat bonuses are retained.` : ''} Set the mark colors manually for planning; mark and proc effects are not modeled.`);
}
function impTotems(st, A, say) {
  if (!A.DivineTotems) return say('warn', 'Divine Totems: not captured by this file; included only through the game-panel remainder.');
  const rows = impLoadout(A, 'DivineTotems', say);
  const level = impNum(impObj(A.TotemExp).kLevel);
  const enhancement = level === 0 ? 0 : D.tables.TotemLvConfig[level]?._iAttributeEnhance;
  if (enhancement === undefined && rows.length)
    say('warn', 'Divine Totems: system enhancement unavailable; omitted enhancement remains in the game-panel remainder.');
  let omitted = 0;
  for (const { ref, item } of rows) {
    const info = impObj(item.kTotemInfo);
    const attrs = impVals(info.kAttrList).flatMap((p) => {
      const id = impNum(p.iId), value = impNum(p.iValue);
      if (!D.tables.AttributeConfig[id] || value === undefined) { omitted++; return []; }
      return [[id, value]];
    });
    const skills = impVals(info.kSkillList).flatMap((p) => {
      const id = impNum(impObj(p).iSkillID, typeof p === 'number' ? p : undefined);
      if (!D.tables.TotemSkillConfig[id]) { omitted++; return []; }
      return [id];
    });
    st.totems.push({ guid: st.totems.length + 1, snapshotRef: ref, id: TOTEMS[impNum(item.iItemId)] ? impNum(item.iItemId) : 0, attrs, skills, enhanceBp: enhancement ?? 0 });
  }
  st.totemLv = enhancement === undefined ? 0 : level;
  say(omitted || st.totems.some((t) => t.skills.length) ? 'warn' : 'ok', `Divine Totems: ${rows.length} deployed, system level ${level ?? 'unknown'}, rolls and supported skill stat-effects included.${omitted ? ` ${omitted} unknown attributes/skills omitted.` : ''} Dynamic procs and other effects are not all modeled.`);
}
// The talent nodes of the open plan: stat nodes by their levels, a branch point as passed with its job talent pick; the Talent Lv follows from them.
function impTalents(st, A, say, any) {
  let nodes = impObj(A.SeasonTalentData);
  if (!impVals(nodes).some((n) => impNum(impObj(n).currentLevel) !== undefined)) {
    const plans = impObj(A.SeasonTalentPlanInfo);
